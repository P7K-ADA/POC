name: Glauma

options:
  bundleIdPrefix: com.p7kada
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  POC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: POC
        excludes:
          - "**/.DS_Store"
          - "Models/Patient.swift"

      - path: APIs
        excludes:
          - "**/.DS_Store"

    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreNFC.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: Vision.framework
      - framework: opencv2.xcframework
        embed: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p7kada.poc
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W9AZH37T99
        CODE_SIGN_ENTITLEMENTS: POC/POC.entitlements

        INFOPLIST_KEY_CFBundleDisplayName: Glauma
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is needed to capture eye images."
        INFOPLIST_KEY_NFCReaderUsageDescription: "Glauma uses NFC to detect the attached frame."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Allow Glauma to save captured or processed eye images to your Photos library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

        FRAMEWORK_SEARCH_PATHS:
        - $(inherited)
        - $(PROJECT_DIR)/opencv2.xcframework/ios-arm64

        SWIFT_OBJC_BRIDGING_HEADER: POC/Core/Services/Inference/POC-Bridging-Header.h

        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
